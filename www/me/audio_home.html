<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    --gold: #C9A84C;

    --dark: #0D1117;
    --dark-2: #161B22;
    --dark-card: #1A2233;
    --green: #2E7D52;
    --green-light: #4CAF7A;
    --text: #E8E8E8;
    --text-muted: #8B9BC4;
    --border: rgba(201,168,76,0.18);

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 50% at 80% 20%, rgba(46,125,82,0.10) 0%, transparent 60%), var(--dark);
    z-index: -1;
  }
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(13,17,23,0.9);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--gold);
    text-decoration: none;
    font-size: 0.9rem;
    transition: gap 0.2s;
  }
  .nav-back:hover { gap: 12px; }
  .nav-logo {
    font-family: 'Amiri', serif;
    font-size: 1.2rem;
    color: var(--text);
  }

  header {
    text-align: center;
    padding: 48px 20px 40px;
  }
  .page-title {
    font-family: 'Amiri', serif;
    font-size: clamp(1.8rem, 6vw, 3rem);
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  .page-sub {
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 300;
  }
  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 20px auto;
  }

  .list-wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 16px 60px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .audio-item {
    background: var(--dark-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .audio-item:hover {
    border-color: rgba(201,168,76,0.4);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .audio-meta {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .audio-title {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
  }
  .audio-desc {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 3px;
    font-family: 'Amiri', serif;
    font-size: 1rem;
    direction: rtl;
  }
  .audio-num {
    background: rgba(201,168,76,0.12);
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--gold);
    border-radius: 8px;
    padding: 3px 10px;
    font-size: 0.78rem;
    font-weight: 500;
    flex-shrink: 0;
  }
  audio {
    width: 100%;
    height: 36px;
    border-radius: 8px;
    outline: none;
    accent-color: var(--gold);
  }
  audio::-webkit-media-controls-panel {
    background: var(--dark-2);
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 24px 20px;
    text-align: center;
  }
  .footer-logo { font-size: 0.85rem; color: var(--text-muted); }
  .footer-logo span { color: var(--gold); font-weight: 600; }
</style>
</head>
